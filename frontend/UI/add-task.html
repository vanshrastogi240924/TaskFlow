<!-- Form Canvas -->
<div class="bg-surface-container-low border border-outline-variant rounded-[1.5rem] p-lg shadow-sm">
<form class="flex flex-col gap-lg"action="dashboard.html">
<!-- Title and Category Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<div class="flex flex-col gap-sm">
<label class="text-label-md font-label-md text-on-surface-variant ml-1">Task Title</label>
<input class="w-full px-md py-md rounded-xl bg-surface border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary-fixed outline-none transition-all text-body-md font-body-md" placeholder="e.g. Q4 Strategy Review" type="text"/>
</div>
<div class="flex flex-col gap-sm">
<label class="text-label-md font-label-md text-on-surface-variant ml-1">Category</label>
<div class="relative">
<select class="w-full appearance-none px-md py-md rounded-xl bg-surface border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary-fixed outline-none transition-all text-body-md font-body-md cursor-pointer">
<option>Development</option>
<option>Marketing</option>
<option>Operations</option>
<option>Design</option>
<option>Personal</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<!-- Description -->
<div class="flex flex-col gap-sm">
<label class="text-label-md font-label-md text-on-surface-variant ml-1">Description</label>
<textarea class="w-full px-md py-md rounded-xl bg-surface border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary-fixed outline-none transition-all text-body-md font-body-md resize-none" placeholder="Break down the steps or context for this task..." rows="4"></textarea>
</div>
<!-- Deadline and Priority Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<div class="flex flex-col gap-sm">
<label class="text-label-md font-label-md text-on-surface-variant ml-1">Deadline</label>
<div class="relative">
<input class="w-full px-md py-md rounded-xl bg-surface border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary-fixed outline-none transition-all text-body-md font-body-md" type="datetime-local"/>
</div>
</div>
<div class="flex flex-col gap-sm">
<label class="text-label-md font-label-md text-on-surface-variant ml-1">Priority Level</label>
<div class="flex flex-wrap gap-sm">
<label class="cursor-pointer group">
<input class="sr-only peer" name="priority" type="radio" value="low"/>
<span class="px-md py-2 rounded-full border border-outline-variant text-label-md font-label-md text-on-surface-variant peer-checked:bg-secondary-container peer-checked:text-on-secondary-container peer-checked:border-secondary transition-all block group-hover:bg-surface-container-high">Low</span>
</label>
<label class="cursor-pointer group">
<input checked="" class="sr-only peer" name="priority" type="radio" value="medium"/>
<span class="px-md py-2 rounded-full border border-outline-variant text-label-md font-label-md text-on-surface-variant peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary transition-all block group-hover:bg-surface-container-high">Medium</span>
</label>
<label class="cursor-pointer group">
<input class="sr-only peer" name="priority" type="radio" value="high"/>
<span class="px-md py-2 rounded-full border border-outline-variant text-label-md font-label-md text-on-surface-variant peer-checked:bg-tertiary-container peer-checked:text-on-tertiary-container peer-checked:border-tertiary transition-all block group-hover:bg-surface-container-high">High</span>
</label>
<label class="cursor-pointer group">
<input class="sr-only peer" name="priority" type="radio" value="urgent"/>
<span class="px-md py-2 rounded-full border border-outline-variant text-label-md font-label-md text-on-surface-variant peer-checked:bg-error-container peer-checked:text-on-error-container peer-checked:border-error transition-all block group-hover:bg-surface-container-high">Urgent</span>
</label>

<script>
        // Micro-interactions for form inputs
        const inputs = document.querySelectorAll('input, textarea, select');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label')?.classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label')?.classList.remove('text-primary');
            });
        });

        // Form submission prevention for demo
      
    
    </script>
